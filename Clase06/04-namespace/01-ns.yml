apiVersion: v1
kind: Namespace
metadata:
  name: ns-dev
  labels:
    env: dev
    app: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-prd
  labels:
    env: prd
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs-server-web
  labels:
    app: frontend
    env: dev
  namespace: ns-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      env: dev
  template:
    metadata:
      labels:
        app: frontend
        env: dev
      namespace: ns-dev
    spec:
      containers:
        - name: container01
          image: python:3.7-alpine
          command: [
            "sh",
            "-c",
            "echo 'página desde python' > index.html && python -m http.server 8080"
          ]     
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs-server-web
  labels:
    app: frontend
    env: prd
  namespace: ns-prd
spec:
  replicas: 8
  selector:
    matchLabels:
      app: frontend
      env: prd
  template:
    metadata:
      labels:
        app: frontend
        env: prd
      namespace: ns-prd
    spec:
      containers:
        - name: container01
          image: python:3.7-alpine
          command: [
            "sh",
            "-c",
            "echo 'página desde python' > index.html && python -m http.server 8080"
          ]               