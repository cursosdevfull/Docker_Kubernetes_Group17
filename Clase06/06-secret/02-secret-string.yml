apiVersion: v1
kind: Namespace
metadata:
  name: ns-dev
  labels:
    env: dev
    app: frontend
---
apiVersion: v1
kind: Secret
metadata:
  name: parameters
  namespace: ns-dev
stringData:
  dbHost: http://dev-database.mycompany.com
  dbPort: "3306"
  dbUser: user-100
  dbPass: 3LgIGANTe2025?
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs-server-web
  labels:
    app: frontend
    env: dev
  namespace: ns-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      env: dev
  template:
    metadata:
      labels:
        app: frontend
        env: dev
      namespace: ns-dev
    spec:
      containers:
        - name: container01
          image: python:3.7-alpine
          command: [
            "sh",
            "-c",
            "echo 'página desde python' > index.html && python -m http.server 8080"
          ]
          env:
            - name: TITLE
              value: "Frontend App"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: parameters
                  key: dbHost
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: parameters
                  key: dbPort
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: parameters
                  key: dbUser
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: parameters
                  key: dbPass                  